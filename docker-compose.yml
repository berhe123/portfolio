services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - '8080:80'
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ['full']
    environment:
      POSTGRES_USER: berhe
      POSTGRES_PASSWORD: berhe
      POSTGRES_DB: berhe
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ['full']
    ports:
      - '6379:6379'

volumes:
  postgres_data:
